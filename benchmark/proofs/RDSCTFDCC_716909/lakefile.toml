name = "rdsctfdcc_716909"
version = "0.1.0"
defaultTargets = ["Proof"]
moreLeanArgs = ["-j", "4"]

[leanOptions]
warn.sorry = true
warningAsError = true
linter.dupNamespace = false
linter.unusedVariables = false
linter.unusedSimpArgs = false
linter.unnecessarySimpa = false
linter.unusedSectionVars = false
linter.unusedTactic = false
linter.unnecessarySeqFocus = false
exponentiation.threshold = 10000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "905b95818eb32af7874a58b427f50c1711a5e96c"

[[lean_lib]]
name = "Proof"
globs = ["Proof.+"]
